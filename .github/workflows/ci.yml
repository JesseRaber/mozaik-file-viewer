name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No package-lock.json is committed yet, so `npm ci` would fail.
      # Once you run `npm install` locally and commit package-lock.json,
      # switch this to `npm ci` and add `cache: npm` to setup-node above.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
